spring.application.name=demo

# Server
server.port=8080

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3309/appdb
spring.datasource.username=root
spring.datasource.password=rootpass

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=redispass
spring.data.redis.timeout=2s

# App cache config
app.cache.ttl.user-seconds=300
app.cache.ttl.product-seconds=300
app.cache.ttl.null-seconds=60
app.cache.ttl.jitter-seconds=60
