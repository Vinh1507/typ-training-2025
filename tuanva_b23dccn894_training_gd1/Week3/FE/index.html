<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vũ Anh Tuấn - Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Thanh điều hướng cố định -->
    <nav>
        <ul>
            <li><a href="#home">Trang Chủ</a></li>
            <li><a href="#skills">Kỹ Năng</a></li>
            <li><a href="#experience">Kinh Nghiệm</a></li>
            <li><a href="#contact">Liên Hệ</a></li>
        </ul>
    </nav>

    <!-- Phần đầu trang -->
    <header id="home">
        <img src="images/check.jpg" alt="Ảnh đại diện của Vũ Anh Tuấn">
        <h1>Vũ Anh Tuấn</h1>
        <p class="title">Lập trình viên Web</p>
    </header>

    <!-- Nội dung chính -->
    <main>
        <!-- Kỹ năng -->
        <section id="skills">
            <h2>Kỹ Năng & Sở Thích</h2>
            <div class="skills-grid">
                <!-- JS sẽ tự động render các skill ở đây -->
            </div>
        </section>

        <!-- Kinh nghiệm -->
        <section id="experience">
            <h2>Học Vấn & Kinh Nghiệm</h2>
            <table>
                <thead>
                    <tr>
                        <th>Năm</th>
                        <th>Vị Trí / Học Vấn</th>
                        <th>Mô Tả</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- JS sẽ render nội dung tại đây -->
                </tbody>
            </table>
        </section>

        <!-- Liên hệ -->
        <section id="contact">
            <h2>Liên Hệ</h2>
            <form>
                <div class="form-group">
                    <label for="name">Họ Tên</label>
                    <input type="text" id="name" name="name" placeholder="Nhập họ tên của bạn" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Nhập email của bạn" required>
                </div>

                <div class="form-group">
                    <label for="message">Nội Dung</label>
                    <textarea id="message" name="message" placeholder="Nhập nội dung tin nhắn của bạn" required></textarea>
                </div>

                <button type="submit">Gửi Tin Nhắn</button>
            </form>
        </section>
    </main>

    <!-- Chân trang -->
    <footer>
        <p>&copy; 2025 Vũ Anh Tuấn. All rights reserved.</p>
    </footer>

    <!-- Gắn file JS -->
    <script src="main.js"></script>
</body>
</html>
