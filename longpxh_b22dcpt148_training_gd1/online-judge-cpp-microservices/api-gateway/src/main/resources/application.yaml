server:
  port: 8080


logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: TRACE
    org.springframework.web.reactive: TRACE
    reactor.ipc.netty: TRACE
    reactor.netty: TRACE
spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:http://config-service:8888/"
  cloud:
    gateway:
      httpclient:
        wiretap: true
      discovery:
        locator:
          enabled: true  # Tự động tạo routes từ Eureka
          lower-case-service-id: true  # URL lowercase
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # Route cho C++ Judge Service (không có trong Eureka)
        - id: judge-service
          uri: http://judge-service:8084  # Địa chỉ Judge Service
          predicates:
            - Path=/judge/**
          filters:
            - StripPrefix=1  # Bỏ /judge khỏi path
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**, /api/users/**
        - id: submission-service
          uri: http://submission-service:8083
          predicates:
            - Path=/api/submissions/**
        - id: core-service
          uri: http://core-service:8082
          predicates:
            - Path=/api/**
# Đăng ký với Eureka
eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
# Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway