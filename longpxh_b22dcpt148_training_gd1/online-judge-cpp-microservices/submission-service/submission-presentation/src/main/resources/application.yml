spring:
  application:
    name: submission-service
  datasource:
    url: jdbc:postgresql://localhost:5432/submission_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  cloud:
    openfe ign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 5000
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8083

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

logging:
  level:
    com.oj_cpp.submission: DEBUG
