spring:
  application:
    name: core-service
  datasource:
    url: jdbc:postgresql://localhost:5432/oj_core_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  flyway:
    enabled: true
    baseline-on-migrate: true
  cloud:
    config:
      enabled: true
      uri: http://localhost:8888
      fail-fast: false

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-jwt-token-generation-and-validation}

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    preferIpAddress: true

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
