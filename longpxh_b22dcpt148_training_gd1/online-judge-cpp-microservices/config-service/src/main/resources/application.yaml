server:
  port: 8888

spring:
  application:
    name: config-service
  profiles:
    active: local
  cloud:
    config:
      server:
        git:
          uri: http://gitlab.longpxh.tech/root/oj-config-repo.git
          username: root
          password: ${GITLAB_TOKEN}
          default-label: main
          skip-ssl-validation: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh