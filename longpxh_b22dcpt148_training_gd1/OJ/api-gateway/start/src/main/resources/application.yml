spring:
  application:
    name: online-judge-api
  profiles:
    active: ${OJ_SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${OJ_DB_URL:jdbc:postgresql://localhost:5432/oj_cpp}
    username: ${OJ_DB_USERNAME:oj_dev}
    password: ${OJ_DB_PASSWORD:DevOJ@123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${DEBUG:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${DEBUG:false}
        default_batch_fetch_size: ${HIBERNATE_BATCH_FETCH_SIZE:16}
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/seed
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    table: migrations
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:true}
    clean-disabled: ${FLYWAY_CLEAN_DISABLED:true}
    repair-on-validation-error: true


  data:
    redis:
      host: ${OJ_REDIS_HOST:localhost}
      port: ${OJ_REDIS_PORT:6379}
      password: ${OJ_REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
      file-size-threshold: 1KB

server:
  port: ${OJ_SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    context-path: ${OJ_SERVLET_CONTEXT_PATH:/}

logging:
  level:
    root: INFO
    com.oj: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

jwt:
  secret: ${OJ_JWT_SECRET:your-secret-key-change-this-in-production}
  expiration: ${OJ_JWT_EXPIRATION:86400}
  refresh-expiration: ${OJ_JWT_REFRESH_EXPIRATION:604800}

app:
  url: ${OJ_APP_URL:http://localhost:8080}
  name: OJ API Gateway
  version: 0.1.0

storage:
  default: ${OJ_STORAGE_DEFAULT:private}
  disks:
    public:
      driver: local
      root: ${OJ_STORAGE_APP_PUBLIC_ROOT:storage/app/public}
      url: ${OJ_APP_URL}/storage
      visibility: public
    private:
      driver: local
      root: ${OJ_STORAGE_APP_PRIVATE_ROOT:storage/app/private}
      visibility: private

management:
  endpoints:
    web:
      exposure:
        include: ${OJ_MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
  endpoint:
    health:
      show-details: ${OJ_MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:always}
  metrics:
    export:
      prometheus:
        enabled: ${OJ_MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED:true}

external:
  api:
    base-url: ${OJ_EXTERNAL_API_BASE_URL:https://api.external-service.com}
    key: ${OJ_EXTERNAL_API_KEY}
    timeout: 30000
# end of configuration
