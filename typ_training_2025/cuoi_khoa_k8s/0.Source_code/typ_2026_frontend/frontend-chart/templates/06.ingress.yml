{{- if .Values.frontend.ingress.enabled -}}
{{- $fullName := include "frontend-chart.fullname" . -}}
{{- $svcPort := .Values.frontend.service.port -}}

# ... (Đoạn check version API giữ nguyên) ...
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "helm-chart.componentName" (dict "root" . "component" "frontend") }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frontend-chart.labels" . | nindent 4 }}
  {{- with .Values.frontend.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.frontend.ingress.className }}
  tls:
    {{- range .Values.frontend.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  rules:
    {{- range .Values.frontend.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "helm-chart.componentName" (dict "root" $ "component" "frontend") }}
                port:
                  number: {{ $svcPort }}
          {{- end }}
    {{- end }}
{{- end }}