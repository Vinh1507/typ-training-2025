apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helm-chart.componentName" (dict "root" . "component" "frontend") }}-config
  labels:
    {{- include "helm-chart.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
data:
  default.conf: |
    # 1. Định nghĩa format JSON với đúng 3 key quan trọng bạn yêu cầu
    log_format json_analytics escape=json
    '{'
        '"timestamp":"$time_iso8601",'
        '"request_path":"$uri",'              
        '"http_method":"$request_method",'    
        '"response_code":$status,'            
        '"remote_addr":"$remote_addr",'
        '"query_string":"$query_string",'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'       
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_response_time":"$upstream_response_time"'
    '}';

    server {
        listen {{ .Values.frontend.service.port }};
        server_name localhost;

        access_log /dev/stdout json_analytics;
        error_log /dev/stderr warn;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        location /api {
            proxy_pass http://{{ .Values.backend.name }}:{{ .Values.backend.service.port }};
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            # Forward IP thật để Backend cũng log đúng remote_ip
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /nginx_status {
            stub_status;
            access_log off; 

            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
    }