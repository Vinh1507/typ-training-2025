image: docker:latest

variables:
  TAG: $CI_COMMIT_REF_SLUG
  DOCKER_BUILDKIT: 1
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

stages:
  - build
  - test
  - scan
  - deploy
  - rollback
  - notify

include:
  - template: Code-Quality.gitlab-ci.yml

build_job:
  stage: build
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
  before_script: 
    - docker info
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" == "main" ]; then
        TAG="production"
      elif [ "$CI_COMMIT_BRANCH" == "dev" ]; then
        TAG="staging"
      else
        TAG="$CI_COMMIT_REF_SLUG"
      fi
      docker pull $CI_REGISTRY_IMAGE/stemhub:$TAG || true
      docker compose build --build-arg TAG=$TAG
      docker push $CI_REGISTRY_IMAGE/stemhub:$TAG
  cache:
    paths:
      - .docker-cache/
    key: docker-cache
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"  
    - if: $CI_COMMIT_TAG

unit_test_coverage:
  stage: test
  image: maven:3.9.6-eclipse-temurin-21-alpine
  script:
    - cd StemHub
    - mvn clean test
    - mvn jacoco:report
    - awk -F"," '{ instructions += $4 + $5; covered += $5 } END { print covered, "/", instructions, " instructions covered"; print 100*covered/instructions "% covered" }' target/site/jacoco/jacoco.csv
  coverage: '/(\d+\.?\d*)% covered/'
  artifacts:
    when: always
    reports:
      junit: StemHub/target/surefire-reports/TEST-*.xml
    paths:
      - StemHub/target/site/jacoco/
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

test_job:
  stage: test
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
  before_script: 
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      if [ -z "$ENV_FILE" ]; then
        echo "ERROR: ENV_FILE variable is not set"
        exit 1
      fi
      cp "$ENV_FILE" .env
    - docker compose pull
    - docker compose up -d --wait
    - sleep 10
    - docker compose ps
    - curl -f http://localhost:8080/health 2>/dev/null || echo "Health check optional"
    - docker compose down
  needs: ["build_job"]
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_TAG

code_quality:
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_TAG

security_scan:
  stage: scan
  image: 
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_AUTH_URL: "$CI_REGISTRY"
    TRIVY_NO_PROGRESS: "true"
  script:
    - trivy fs --severity HIGH,CRITICAL --exit-code 0 --no-progress . 
    - trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress "$CI_REGISTRY_IMAGE/stemhub:$TAG"
  allow_failure: true
  needs: ["build_job"]
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_TAG

deploy_staging_job: 
  stage: deploy
  image: docker:latest
  tags: ["self-hosted"]
  before_script: 
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - cp "$ENV_FILE" .env && echo "" >> .env
    - export TAG=$CI_COMMIT_REF_SLUG
  script:
    - |
      CURRENT_ID=$(docker inspect --format='{{.Image}}' stemhub 2>/dev/null || true)
      if [ ! -z "$CURRENT_ID" ]; then
          docker tag $CURRENT_ID stemhub:backup || true
      fi

      docker compose pull
      docker rm -f stemhub mysql || true
      docker compose down || true
      docker compose up -d --remove-orphans --no-build
      docker system prune -f 

      # Health check với timeout
      timeout=30
      interval=5
      for i in $(seq 1 $((timeout/interval))); do
        if docker ps | grep -w "stemhub" | grep -q "Up"; then
          if curl -f http://localhost:8080/health 2>/dev/null || true; then
            echo '✅ Deploy Success!'
            exit 0
          fi
        fi
        sleep $interval
      done
      echo '❌ Deploy Failed - Container not healthy'
      exit 1
  needs: ["test_job", "unit_test_coverage"]
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      when: always
    - if: $CI_COMMIT_TAG
      when: always

deploy_production_job:
  stage: deploy
  image: docker:latest
  tags: ["self-hosted"]
  before_script:
    - cp "$SSH_KEY" gitlab_ci_cd.pem && chmod 600 gitlab_ci_cd.pem
    - cp "$ENV_FILE" .env && echo "" >> .env
    - echo "TAG=production" >> .env 
    - echo "CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE" >> .env
  script:
    - ssh -o StrictHostKeyChecking=no -i gitlab_ci_cd.pem $DEPLOY_USER@$DEPLOY_HOST "mkdir -p StemHub"
    - scp -o StrictHostKeyChecking=no -i gitlab_ci_cd.pem docker-compose.yml .env $DEPLOY_USER@$DEPLOY_HOST:StemHub/
    - |
      ssh -o StrictHostKeyChecking=no -i gitlab_ci_cd.pem $DEPLOY_USER@$DEPLOY_HOST "
          cd StemHub/ &&
          docker login -u '$CI_REGISTRY_USER' -p '$CI_REGISTRY_PASSWORD' '$CI_REGISTRY' &&
          
          # Pull image với tag production (thay vì staging)
          docker pull $CI_REGISTRY_IMAGE/stemhub:production &&
          
          docker-compose down --remove-orphans || true &&
          docker-compose up -d --no-build &&
          
          docker image prune -f
        "
  needs: ["build_job"]  
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

rollback_job:
  stage: rollback
  image: docker:latest
  tags: ["self-hosted"]
  before_script:
    - cp "$SSH_KEY" gitlab_ci_cd.pem && chmod 600 gitlab_ci_cd.pem
  script:
    - |
      if [ -n "$ENV_FILE" ] && [ -f "$ENV_FILE" ]; then
        cp "$ENV_FILE" .env && echo "" >> .env
      fi

      if [[ "$(docker images -q stemhub:backup 2> /dev/null)" == "" ]]; then 
        echo "No backup image found!"
        exit 1
      fi
      
      export TAG=backup
      docker rm -f stemhub mysql || true
      docker compose down || true
      docker compose up -d --remove-orphans --no-build
  needs: ["deploy_staging_job"]
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      when: on_failure
    - if: $CI_COMMIT_TAG
      when: on_failure

notify_success:
  stage: notify
  image: curlimages/curl:latest
  script:
    - |
      curl -H "Content-Type: application/json" \
      -d "{\"content\": \"✅ **DEPLOY SUCCESS!** 🚀\\n**Project:** $CI_PROJECT_NAME\\n**Branch:** $CI_COMMIT_REF_SLUG\\n**User:** $GITLAB_USER_NAME\\n**Status:** 🟢 Thành công\\n👉 [Xem Pipeline]($CI_PIPELINE_URL)\"}" \
      $DISCORD_WEBHOOK_URL
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"
      when: on_success

notify_fail:
  stage: notify
  image: curlimages/curl:latest
  script:
    - |
      curl -H "Content-Type: application/json" \
      -d "{\"content\": \"🚨 **PIPELINE FAILED!** 💥\\n**Project:** $CI_PROJECT_NAME\\n**Branch:** $CI_COMMIT_REF_SLUG\\n**User:** $GITLAB_USER_NAME\\n**Status:** 🔴 Thất bại\\n👉 [Xem lỗi tại đây]($CI_PIPELINE_URL)\"}" \
      $DISCORD_WEBHOOK_URL
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"
      when: on_failure