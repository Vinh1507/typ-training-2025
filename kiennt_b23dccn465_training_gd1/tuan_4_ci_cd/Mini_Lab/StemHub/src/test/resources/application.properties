# ==========================================
# CẤU HÌNH DATABASE GIẢ LẬP (H2 In-Memory)
# ==========================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Tự động tạo bảng sạch mỗi lần chạy test
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==========================================
# CẤU HÌNH GIÁ TRỊ GIẢ (DUMMY VALUES)
# Để thay thế cho các biến môi trường ${...}
# ==========================================

# 1. JWT (Bắt buộc phải có để App khởi động)
# Key phải khớp y hệt file gốc: jwt.secret.key
jwt.secret.key=test_secret_key_phai_du_dai_de_khong_bi_loi_weak_key_test_test
jwt.expiration.ms=86400000

# 2. Cloudflare R2 (Nguyên nhân gây lỗi trước đó)
# Key phải viết thường và dùng dấu gạch ngang (-) y hệt file gốc
cloudflare.r2.account-id=test-account-id
cloudflare.r2.access-key=test-access-key
cloudflare.r2.secret-key=test-secret-key
cloudflare.r2.bucket-name=test-bucket
cloudflare.r2.endpoint-url=https://test-endpoint.com
cloudflare.r2.public-url=https://test-public-url.com

# 3. Các cấu hình khác (Giữ nguyên hoặc tắt bớt cho nhẹ)
spring.main.lazy-initialization=true
spring.main.banner-mode=off
logging.level.root=ERROR