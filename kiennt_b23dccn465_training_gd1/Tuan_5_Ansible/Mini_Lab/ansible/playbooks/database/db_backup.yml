- name: MySQL Backup (Docker Version)
  hosts: db-server
  become: yes
  gather_facts: yes 

  vars:
    backup_dir: /backups
    container_name: mysql_db 
    
    db_name: "{{ lookup('env','MYSQL_DATABASE') }}"
    db_user: "{{ lookup('env','MYSQL_USER') }}"
    db_password: "{{ lookup('env','MYSQL_PASSWORD') }}"

  tasks:
  - name: Install Docker and Python Docker SDK
    ansible.builtin.apt:
      name:
        - docker.io
        - python3-docker
      state: present
      update_cache: yes

  - name: Ensure Docker service is started
    ansible.builtin.service:
      name: docker
      state: started
      enabled: yes

  - name: Ensure MySQL container is running
    community.docker.docker_container_info:
      name: "{{ container_name }}"
    register: mysql_info

  - name: Fail if MySQL container is not running
    ansible.builtin.fail:
      msg: "MySQL container '{{ container_name }}' not found/running on db-server"
    when: not mysql_info.exists

  - name: Ensure backup directory exists
    ansible.builtin.file:
      path: "{{ backup_dir }}"
      state: directory
      mode: "0755"

  - name: Backup MySQL via Docker Exec
    tags: backup
    ansible.builtin.shell: >
      docker exec {{ container_name }} 
      mysqldump -u {{ db_user }} -p'{{ db_password }}' {{ db_name }} 
      > {{ backup_dir }}/{{ db_name }}_{{ ansible_date_time.iso8601_basic_short }}.sql
    changed_when: true

  - name: Remove backups older than 7 days
    tags: clean
    ansible.builtin.find:
      paths: "{{ backup_dir }}"
      patterns: "*.sql"
      age: "7d" 
    register: old_backups

  - name: Delete old backup files
    tags: clean
    ansible.builtin.file:
      path: "{{ item.path }}"
      state: absent
    loop: "{{ old_backups.files }}"