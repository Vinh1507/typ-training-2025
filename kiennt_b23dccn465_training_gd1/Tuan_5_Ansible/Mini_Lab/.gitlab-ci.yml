image: docker:latest

variables:
  TAG: $CI_COMMIT_REF_SLUG
  DOCKER_BUILDKIT: 1
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

stages:
  - build
  - test
  - scan
  - deploy 
  - rollback
  - notify

include:
  - template: Code-Quality.gitlab-ci.yml

build_job:
  stage: build
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
  before_script: 
    - docker info
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker pull $CI_REGISTRY_IMAGE/backend:$TAG || true
    - docker pull $CI_REGISTRY_IMAGE/frontend:$TAG || true
    - docker compose build --build-arg TAG=$TAG
    - docker push $CI_REGISTRY_IMAGE/backend:$TAG
    - docker push $CI_REGISTRY_IMAGE/frontend:$TAG
  cache:
    paths:
      - .docker-cache/
    key: docker-cache
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"  
    - if: $CI_COMMIT_TAG

unit_test_coverage:
  stage: test
  image: maven:3.9.6-eclipse-temurin-21-alpine
  services: []
  script:
    - cd backend  
    - mvn clean test
    - mvn jacoco:report
    - awk -F"," '{ instructions += $4 + $5; covered += $5 } END { print covered, "/", instructions, " instructions covered"; print 100*covered/instructions "% covered" }' target/site/jacoco/jacoco.csv
  coverage: '/(\d+\.?\d*)% covered/'
  artifacts:
    when: always
    reports:
      junit: backend/target/surefire-reports/TEST-*.xml
    paths:
      - backend/target/site/jacoco/

test_job:
  stage: test
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
  before_script: 
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      if [ -z "$ENV_FILE" ]; then
        echo "ERROR: ENV_FILE variable is not set"
        exit 1
      fi
      cp "$ENV_FILE" .env
    - docker compose pull 
    - docker compose up -d --wait
    - sleep 10
    - docker compose ps
    - curl -f http://localhost:8080/health 2>/dev/null || echo "Health check optional"
    - docker compose down
  needs: ["build_job"]
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_TAG

code_quality:
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_TAG

security_scan:
  stage: scan
  image: 
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_AUTH_URL: "$CI_REGISTRY"
    TRIVY_NO_PROGRESS: "true"
  script:
    - trivy fs --severity HIGH,CRITICAL --exit-code 0 --no-progress . 
    - trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress "$CI_REGISTRY_IMAGE/backend:$TAG"
    - trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress "$CI_REGISTRY_IMAGE/frontend:$TAG"
  allow_failure: true
  needs: ["build_job"]
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_TAG

deploy_job:
  stage: deploy
  image: alpine:latest 
  tags: 
    - deploy-runner
  before_script: 
    - cd ansible
    - apk add --no-cache ansible openssh-client 
    - cp "$ENV_FILE" .env
    - echo "CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE" >> .env
    - echo "TAG=$TAG" >> .env
    - echo "CI_REGISTRY=$CI_REGISTRY" >> .env
    - echo "CI_REGISTRY_USER=$CI_REGISTRY_USER" >> .env
    - echo "CI_REGISTRY_PASSWORD=$CI_REGISTRY_PASSWORD" >> .env
  script:
    - ansible-playbook backup.yml
    - ansible-playbook deploy.yml
  needs: ["build_job", "test_job"]
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" 
    - if: $CI_COMMIT_TAG

rollback_job:
  stage: rollback
  image: alpine:latest
  tags: 
    - deploy-runner
  before_script: 
    - cd ansible
    - apk add --no-cache ansible openssh-client 
    - cp "$ENV_FILE" .env
    - echo "CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE" >> .env
    - echo "TAG=$TAG" >> .env
    - echo "CI_REGISTRY=$CI_REGISTRY" >> .env
    - echo "CI_REGISTRY_USER=$CI_REGISTRY_USER" >> .env
    - echo "CI_REGISTRY_PASSWORD=$CI_REGISTRY_PASSWORD" >> .env
  script:
    - ansible-playbook rollback.yml
  needs: ["deploy_job"] 
  when: manual 
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" 
    - if: $CI_COMMIT_TAG

notify_success:
  stage: notify
  image: curlimages/curl:latest
  script:
    - |
      curl -H "Content-Type: application/json" \
      -d "{\"content\": \"✅ **DEPLOY SUCCESS!** 🚀\\n**Project:** $CI_PROJECT_NAME\\n**Branch:** $CI_COMMIT_REF_SLUG\\n**User:** $GITLAB_USER_NAME\\n**Status:** 🟢 Thành công\\n👉 [Xem Pipeline]($CI_PIPELINE_URL)\"}" \
      $DISCORD_WEBHOOK_URL
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"
      when: on_success

notify_fail:
  stage: notify
  image: curlimages/curl:latest
  script:
    - |
      curl -H "Content-Type: application/json" \
      -d "{\"content\": \"🚨 **PIPELINE FAILED!** 💥\\n**Project:** $CI_PROJECT_NAME\\n**Branch:** $CI_COMMIT_REF_SLUG\\n**User:** $GITLAB_USER_NAME\\n**Status:** 🔴 Thất bại\\n👉 [Xem lỗi tại đây]($CI_PIPELINE_URL)\"}" \
      $DISCORD_WEBHOOK_URL
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"
      when: on_failure