image: docker:latest

variables:
  TAG: $CI_COMMIT_REF_SLUG
  DOCKER_BUILDKIT: 1
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

stages:
  - build
  - test
  - scan

include:
  - template: Code-Quality.gitlab-ci.yml

build_job:
  stage: build
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
  before_script: 
    - docker info
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker pull $CI_REGISTRY_IMAGE/backend:$TAG || true
    - docker pull $CI_REGISTRY_IMAGE/frontend:$TAG || true
    - docker compose build --build-arg TAG=$TAG
    - docker push $CI_REGISTRY_IMAGE/backend:$TAG
    - docker push $CI_REGISTRY_IMAGE/frontend:$TAG
  cache:
    paths:
      - .docker-cache/
    key: docker-cache
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"  
    - if: $CI_COMMIT_TAG

unit_test_coverage:
  stage: test
  image: maven:3.9.6-eclipse-temurin-21-alpine
  services: []
  script:
    - ls -la  
    - cd backend  
    - mvn clean test
    - mvn jacoco:report
    - awk -F"," '{ instructions += $4 + $5; covered += $5 } END { print covered, "/", instructions, " instructions covered"; print 100*covered/instructions "% covered" }' target/site/jacoco/jacoco.csv
  coverage: '/(\d+\.?\d*)% covered/'
  artifacts:
    when: always
    reports:
      junit: backend/target/surefire-reports/TEST-*.xml # <--- Sửa đường dẫn artifact
    paths:
      - backend/target/site/jacoco/ # <--- Sửa đường dẫn artifact

test_job:
  stage: test
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
  before_script: 
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      if [ -z "$ENV_FILE" ]; then
        echo "ERROR: ENV_FILE variable is not set"
        exit 1
      fi
      cp "$ENV_FILE" .env
    - docker compose pull 
    - docker compose up -d --wait
    - sleep 10
    - docker compose ps
    - curl -f http://localhost:8080/health 2>/dev/null || echo "Health check optional"
    - docker compose down
  needs: ["build_job"]
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_TAG

code_quality:
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_TAG

security_scan:
  stage: scan
  image: 
    name: aquasec/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_AUTH_URL: "$CI_REGISTRY"
    TRIVY_NO_PROGRESS: "true"
  script:
    - trivy fs --severity HIGH,CRITICAL --exit-code 0 --no-progress . 
    - trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress "$CI_REGISTRY_IMAGE/backend:$TAG"
    - trivy image --severity HIGH,CRITICAL --exit-code 0 --no-progress "$CI_REGISTRY_IMAGE/frontend:$TAG"
  allow_failure: true
  needs: ["build_job"]
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_TAG
