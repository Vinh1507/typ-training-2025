server {
    # Lắng nghe trên cổng HTTP tiêu chuẩn
    listen 80;

    # Thư mục gốc nơi Nginx tìm các file để phục vụ.
    # (Đây là nơi các file build từ thư mục 'dist' của bạn được copy vào)
    root /usr/share/nginx/html;
    index index.html;

    # Cấu hình quan trọng cho SPA
    location / {
        # Dòng lệnh này đảm bảo routing phía client (client-side routing) hoạt động:
        # 1. Thử tìm file tĩnh khớp với URI ($uri).
        # 2. Nếu không tìm thấy, thử tìm thư mục khớp ($uri/).
        # 3. Nếu vẫn không tìm thấy, CHUYỂN HƯỚNG về /index.html
        #    để React Router xử lý đường dẫn.
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API -> backend service (Docker network)
    # Nếu không có block này, POST /api/* sẽ bị Nginx xử lý như route SPA và trả 405.
    location = /api {
        return 301 /api/;
    }

    location ^~ /api/ {
        # Use env-driven upstream so frontend can run on a different host than backend.
        # This also avoids Nginx failing at startup when the upstream hostname isn't resolvable yet.
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $backend_upstream http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        # Preserve incoming Host header (including port, e.g. :81).
        # If we drop the port (using $host), Spring may treat it as cross-origin and reject with "Invalid CORS request".
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tùy chọn: Cấu hình Cache cho trình duyệt 🚀
    # Giúp tăng tốc độ tải trang bằng cách lưu trữ các tài nguyên tĩnh trong trình duyệt người dùng.
    location ~* \.(css|js|gif|ico|jpg|jpeg|png|svg|woff2?|eot|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, must-revalidate, proxy-revalidate";
    }

    # Tùy chọn: Log truy cập và lỗi
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}