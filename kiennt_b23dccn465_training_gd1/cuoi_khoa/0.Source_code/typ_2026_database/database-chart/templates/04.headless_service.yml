apiVersion: v1
kind: Service
metadata:
  name: {{ include "helm-chart.componentName" (dict "root" . "component" "database") }}-headless
  labels:
    {{- include "helm-chart.componentLabels" (dict "root" . "component" "database") | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.database.service.port }}
      targetPort: {{ .Values.database.service.port }}
      name: mysql
  selector:
    {{- include "helm-chart.componentSelectorLabels" (dict "root" . "component" "database") | nindent 4 }}