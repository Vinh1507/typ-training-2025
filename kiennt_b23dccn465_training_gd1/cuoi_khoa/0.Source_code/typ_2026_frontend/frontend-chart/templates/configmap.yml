apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helm-chart.componentName" (dict "root" . "component" "frontend") }}-config
  labels:
    {{- include "helm-chart.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
data:
  default.conf: |
    server {
        listen {{ .Values.frontend.service.port }};
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Xóa dấu / ở cuối cả 2 dòng dưới đây
        location /api {
        {{- if eq .Values.frontend.service.type "NodePort" }}
            proxy_pass http://{{ .Values.frontend.env.BACKEND_HOST }}:{{ .Values.backend.service.nodePort }};
        {{- else }}
            proxy_pass http://{{ .Values.frontend.env.BACKEND_HOST }}:{{ .Values.backend.service.port }};
        {{- end }}
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }