apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "frontend-chart.fullname" . }}-nginx
  labels:
    {{- include "frontend-chart.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen {{ .Values.nginx.listenPort }};
        server_name {{ .Values.nginx.serverName }};

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        {{- if .Values.apiProxy.enabled }}
        location {{ .Values.apiProxy.pathPrefix }} {
            proxy_pass http://{{ .Values.apiProxy.upstream.serviceName }}:{{ .Values.apiProxy.upstream.servicePort }};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
        {{- end }}
    }
