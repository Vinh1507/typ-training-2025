replicaCount: 1
revisionHistoryLimit: 5

image:
  repository: ngtukien213/typ_backend
  tag: "1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: NodePort
  port: 8080
  targetPort: 8080
  # Set null/empty to let k8s allocate.
  nodePort: 30002
  portName: typ-api-port

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: api.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Spring reads these env vars in application.properties
database:
  host: "mysql"
  port: "3306"
  name: "database"
  user: "root"
  password: "rootpassword"
  # If you manage DB password outside this chart, set existingSecret and passwordKey.
  existingSecret: ""
  passwordKey: "MYSQL_PASSWORD"

cors:
  allowedOrigins: "http://localhost:3000"

# Additional plain env vars (non-secret). Rendered into ConfigMap.
env: {}

# Additional env entries (advanced). Example:
# extraEnv:
#   - name: JAVA_TOOL_OPTIONS
#     value: "-XX:MaxRAMPercentage=75"
extraEnv: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# No Actuator dependency in pom.xml, so default probes use tcpSocket.
probes:
  liveness:
    enabled: true
    type: tcp # tcp | http
    path: /actuator/health
    initialDelaySeconds: 45
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    type: tcp # tcp | http
    path: /actuator/health
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: null

nodeSelector: {}
tolerations: []
affinity: {}