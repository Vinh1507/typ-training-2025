apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "helm-chart.fullname" . }}-test-connection"
  labels:
    {{- include "helm-chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['-qO-', 'http://{{ include "helm-chart.componentName" (dict "root" . "component" "frontend") }}:{{ .Values.frontend.service.port }}']
  restartPolicy: Never
